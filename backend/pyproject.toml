[project]
name = "prelegal-backend"
version = "0.1.0"
description = "FastAPI backend for prelegal"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "litellm>=1.104.2",
    "pyjwt>=2.15.1",
    "pwdlib[argon2]>=0.3.1",
    "email-validator>=2.3.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
